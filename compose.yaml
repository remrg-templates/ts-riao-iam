services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - '9000:9000'
    environment:
      NODE_ENV: production

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: Dockerfile.migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
    command: ['npx', 'riao', 'migration:run']
    restart: 'no'

volumes:
  postgres_data:
